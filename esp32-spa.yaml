substitutions:
  version: "3.4"

esphome:
  name: esp32-spa
  friendly_name: esp32-spa
  project:
    name: "kgstorm.esp32-spa"
    version: ${version}

  on_boot:
    # Apply saved settings after the portal and MQTT components initialize.
    # Local mode leaves MQTT disabled and uses the native API instead.
    - priority: 199
      then:
        - if:
            condition:
              lambda: 'return id(spa_setup).is_cloud_mode();'
            then:
              - lambda: |-
                  id(mqtt_client).set_broker_address(id(spa_setup).get_broker());
                  id(mqtt_client).set_broker_port(id(spa_setup).get_port());
                  id(mqtt_client).set_username(id(spa_setup).get_username());
                  id(mqtt_client).set_password(id(spa_setup).get_password());
              - mqtt.enable:
              - logger.log: "Cloud mode: connecting to MQTT broker"
    - priority: -100
      then:
        - delay: 35s
        - if:
            condition:
              switch.is_on: spa_heating_mode_control
            then:
              - script.execute: spa_mode_boot_read
              - script.wait: spa_mode_boot_read
        - delay: 25s
        - if:
            condition:
              switch.is_on: spa_filter_cycle_control
            then:
              - script.execute: filter_cycle_read

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Home Assistant native API — used when the module is in "local" mode
# (Home Assistant on the same network). reboot_timeout is disabled so
# cloud-mode modules (no local API client) don't reboot every 15 minutes.
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

# MQTT — used when the module is in "cloud" mode. The broker address and
# credentials are entered through the module's setup portal (fallback
# hotspot) and applied from flash storage on boot, so this variant ships
# with an empty broker and stays disabled until configured.
mqtt:
  id: mqtt_client
  broker: ""
  port: 8883
  enable_on_boot: false
  reboot_timeout: 0s
  discovery: true
  # Avoid suggesting an unreachable native API connection to cloud HA.
  discover_ip: false
  on_connect:
    - lambda: 'id(spa_setup).set_mqtt_status(-2);'
  on_disconnect:
    - lambda: 'id(spa_setup).set_mqtt_status(static_cast<int>(reason));'
  discovery_prefix: homeassistant
  # Match the entity IDs produced by the native API (sensor.esp32_spa_...)
  # so the spa-control-card works identically in both modes.
  discovery_object_id_generator: device_name
  # TLS is required: the broker certificate is validated against the
  # Let's Encrypt root (the cloud setup script provisions a Let's Encrypt
  # certificate via DuckDNS).
  skip_cert_cn_check: false
