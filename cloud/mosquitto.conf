# Mosquitto configuration for the Balboa spa cloud stack.
#
# Two listeners share one password file:
#   1883 - plaintext, NOT published to the host. Only reachable from other
#          containers on the docker network (Home Assistant connects here).
#   8883 - TLS, published to the internet. The spa module connects here and
#          validates the certificate against the baked-in Let's Encrypt root.

persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwords

listener 8883
allow_anonymous false
password_file /mosquitto/config/passwords
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/key.pem
